<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一学 · 遇见未知的自己 · 思维导图</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --text-secondary: #94a3b8;
    --accent: #f59e0b;
    --accent2: #8b5cf6;
    --accent3: #3b82f6;
    --accent4: #10b981;
    --accent5: #ec4899;
    --accent6: #f97316;
    --node-bg: #1e293b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: linear-gradient(180deg, rgba(15,23,42,0.98) 60%, rgba(15,23,42,0) 100%);
    padding: 20px 30px 35px;
    pointer-events: none;
  }
  header .title-area { pointer-events: auto; }
  header h1 {
    font-size: 22px; font-weight: 700; color: var(--accent);
    letter-spacing: 1px;
  }
  header .subtitle {
    font-size: 13px; color: var(--text-secondary); margin-top: 4px;
  }
  header .date {
    font-size: 12px; color: var(--text-secondary); margin-top: 2px; opacity: 0.7;
  }
  .legend {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-secondary);
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .controls {
    position: fixed; top: 20px; right: 30px; z-index: 101;
    display: flex; gap: 8px;
  }
  .ctrl-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: var(--border); }
  #mindmap-container {
    width: 100%; height: 100vh;
    cursor: grab;
  }
  #mindmap-container:active { cursor: grabbing; }
  #mindmap-container.panning { cursor: grabbing; }
  svg { display: block; }
  .node-group { cursor: pointer; transition: opacity 0.3s; }
  .node-group:hover .node-circle { filter: brightness(1.3); }
  .node-group:hover .node-text { font-weight: 700; }
  .node-circle { transition: all 0.3s ease; }
  .conn-line { stroke-width: 2; stroke-linecap: round; transition: opacity 0.3s; }
  .detail-card {
    position: fixed; right: -420px; top: 100px; width: 380px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
    transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 200; max-height: calc(100vh - 160px); overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .detail-card.show { right: 30px; }
  .detail-card h3 { font-size: 18px; margin-bottom: 12px; color: var(--accent); }
  .detail-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.8; }
  .detail-card .close-btn {
    position: absolute; top: 16px; right: 16px;
    width: 30px; height: 30px; border-radius: 50%;
    border: none; background: var(--border); color: var(--text);
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .detail-card .close-btn:hover { background: var(--text-secondary); }
  .detail-card .tag {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 11px; margin: 4px 4px 4px 0;
  }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 150;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px;
    font-size: 13px; color: var(--text);
    opacity: 0; transition: opacity 0.15s;
    white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .tooltip.visible { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="title-area">
    <h1>🔮 遇见未知的自己</h1>
    <div class="subtitle">Meeting the Unknown Self · 张德芬 · 华语世界首部心灵成长小说</div>
    <div class="date">2026年8月3日 · 每日一学 #80</div>
  </div>
</header>

<div class="controls">
  <button class="ctrl-btn" id="btn-zoom-in" title="放大">+</button>
  <button class="ctrl-btn" id="btn-zoom-out" title="缩小">−</button>
  <button class="ctrl-btn" id="btn-reset" title="重置视角">⟳</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>核心洞见</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div>身份层次模型</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent3)"></div>小我的运作机制</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent4)"></div>破解与转化之道</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent5)"></div>日常实践工具</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent6)"></div>觉醒与整合</div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="detail-card" id="detail-card">
  <button class="close-btn" id="close-detail">✕</button>
  <h3 id="detail-title"></h3>
  <p id="detail-content"></p>
</div>

<div id="mindmap-container"></div>

<script>
(function() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const svgNS = 'http://www.w3.org/2000/svg';
  const container = document.getElementById('mindmap-container');
  const tooltip = document.getElementById('tooltip');
  const detailCard = document.getElementById('detail-card');

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const gRoot = document.createElementNS(svgNS, 'g');
  gRoot.setAttribute('id', 'root-group');
  svg.appendChild(gRoot);

  const defs = document.createElementNS(svgNS, 'defs');
  const glowFilter = document.createElementNS(svgNS, 'filter');
  glowFilter.setAttribute('id', 'glow');
  glowFilter.innerHTML = '<feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/>';
  defs.appendChild(glowFilter);

  const shadowFilter = document.createElementNS(svgNS, 'filter');
  shadowFilter.setAttribute('id', 'shadow');
  shadowFilter.innerHTML = '<feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>';
  defs.appendChild(shadowFilter);
  svg.appendChild(defs);

  container.appendChild(svg);

  const centerX = W / 2;
  const centerY = H / 2;

  const centerNode = {
    id: 'center', label: '遇见\n未知的自己', cx: centerX, cy: centerY, r: 56,
    color: '#f59e0b', category: 'core',
    detail: '《遇见未知的自己》是张德芬创作的心灵成长小说，被誉为"华语世界首部心灵成长小说"。故事以女主角若菱为主线，在一系列人生困境中遇到智慧老人，逐步揭开了小我与真我的深层奥秘。全书核心主题：我们痛苦的根源在于错误地认同了自己的思想、情绪和角色——这些只是"小我"的产物，而非真实的自己。通过觉察、接纳和臣服，每个人都可以剥开层层外壳，遇见那个从未离开的、宁静圆满的"真我"。本书不是理论说教，而是借由一个引人入胜的故事，将深层的心灵法则娓娓道来。'
  };

  const branches = [
    {
      id: 'branch1', label: '核心\n洞见', cx: 0, cy: 0, r: 46, color: '#f59e0b',
      angle: -90, distance: 215, category: 'insights',
      detail: '张德芬在书中提出了几个颠覆性认知，这些洞见构成了全书的理论基石。理解它们，你就掌握了通往内在自由的地图。',
      children: [
        { id: 's1', label: '亲爱的\n外面没有别人', r: 34, color: '#fbbf24', detail: '全书最核心的一句话。我们对外界的反应——愤怒、受伤、失望——本质上都是内在投射。外部的人和事只是触发我们内在已有的情绪模式的开关。改变要向内求，而非向外求。' },
        { id: 's2', label: '你不是你的\n思想/情绪/身体', r: 34, color: '#fbbf24', detail: '人们最深的误解：我就是我的思想。实际上，你是那个观察思想的存在。思想来来去去，但观察者始终不变。这正是笛卡尔"我思故我在"的东方回应——"我在故我思"更接近真相。' },
        { id: 's3', label: '痛苦之身\nPain Body', r: 34, color: '#fbbf24', detail: '每个人体内都积累了一个"痛苦之身"——由过去的创伤、未释放的情绪组成的能量场。它会主动寻找与自身频率匹配的负面情境，以此获取"食物"（更多痛苦），形成恶性循环。' },
        { id: 's4', label: '胜肽的\n成瘾机制', r: 34, color: '#fbbf24', detail: '细胞层面的生化解释：当你长期处于某种情绪状态，细胞表面的受体对相应神经肽产生依赖。如果你习惯了焦虑/愤怒，你的细胞就会"渴望"这种胜肽，让你无意识地制造触发情境。' },
        { id: 's5', label: '吸引力\n法则真相', r: 34, color: '#fbbf24', detail: '不是"想一想就能得到"，而是你的振动频率（由信念、情绪和行为共同构成）在持续广播你"是谁"，宇宙回应的是你的振动频率，而非你的愿望清单。改变内在振动，比送出一千个愿望更有效。' },
        { id: 's6', label: '臣服不是\n放弃', r: 34, color: '#fbbf24', detail: '真正的臣服不是消极认命，而是"接纳事实已经发生"——只有当你停止对抗"已经如此"的事实时，你的能量才能从内耗中释放出来，转向可改变的领域。臣服是最高效的行动前提。' },
        { id: 's7', label: '外面没有\n受害者', r: 34, color: '#fbbf24', detail: '当我们停留在"都是别人的错"的叙事中，我们获得了道德优越感，但失去了力量。从受害者转变为创造者——为自己的感受和反应负全责，才是真正的赋能。' }
      ]
    },
    {
      id: 'branch2', label: '身份层次\n模型', cx: 0, cy: 0, r: 44, color: '#8b5cf6',
      angle: -30, distance: 220, category: 'layers',
      detail: '张德芬提出了一个同心圆式的身份层次模型——从最外层的身体到最核心的真我。理解这个模型，你就知道自己在哪里迷路了。',
      children: [
        { id: 't1', label: '身体\nPhysical', r: 30, color: '#a78bfa', detail: '最外层：我们的肉身、感官、生理需求。绝大多数人一生停留在这层，以为"我就是这具身体"。与身体的失联（忽略饥饿、疲劳、疼痛信号）是灵性迷失的第一站。' },
        { id: 't2', label: '情绪\nEmotional', r: 30, color: '#a78bfa', detail: '第二层：喜怒哀乐、焦虑、恐惧、兴奋。你"感到"愤怒≠你是愤怒的人。情绪是能量的流动，但当我们说"我很愤怒"而非"愤怒正在经过我"时，我们开始认同情绪为自我。' },
        { id: 't3', label: '思想\nMental', r: 30, color: '#a78bfa', detail: '第三层：信念、判断、观点、记忆。这是小我最主要的栖息地——"我认为""我相信""我知道"。90%以上的烦恼来自这里：无限循环的自我对话、灾难化思维、反刍过去。' },
        { id: 't4', label: '角色认同\nIdentity', r: 30, color: '#a78bfa', detail: '第四层：母亲/女儿/员工/成功者/受害者……这些社会标签。当角色受到威胁（失业、离婚、空巢），如果完全认同于角色，就会经历"自我死亡"。角色只是你穿的衣服，不是你。' },
        { id: 't5', label: '潜意识\n编程', r: 30, color: '#a78bfa', detail: '第五层：童年的条件化思维模式、家族模式、社会文化植入。弗洛伊德的冰山隐喻——90%的心理活动在水面以下，但我们误以为意识到的10%就是全部真相。觉察潜意识编程是觉醒的关键一步。' },
        { id: 't6', label: '真我\nTrue Self', r: 30, color: '#a78bfa', detail: '核心层：宁静、喜悦、爱、和平——这些不是你"获得"的品质，而是你本来的状态。你不需要成为"更好的人"才能连结真我；你只需要移除覆盖在真我之上的层层面纱。' }
      ]
    },
    {
      id: 'branch3', label: '小我的\n运作机制', cx: 0, cy: 0, r: 44, color: '#3b82f6',
      angle: 30, distance: 220, category: 'ego',
      detail: '小我不是敌人，而是自我保护的机制。问题在于：当这种保护机制过度活跃，它就成了牢笼。理解小我的策略，你就不再被它操控。',
      children: [
        { id: 'v1', label: '永不休止\n的比较', r: 30, color: '#60a5fa', detail: '小我通过比较来确认自己的存在——比别人好=存在感，比别人差=匮乏感。社交媒体使比较机制全天候运行。事实上，比较是虚假的：你永远在拿自己的"内部体验"对比他人的"外部展示"。' },
        { id: 'v2', label: '永不满足\n的渴求', r: 30, color: '#60a5fa', detail: '小我永远在"下一个"——下一份工作、下一段关系、下一个成就。不是因为你真的需要，而是小我需要"追求"这个动作本身来维持存在感。到达山顶才发现：想要的是登山的感觉，而不是山顶。' },
        { id: 'v3', label: '防卫机制\nDefense', r: 30, color: '#60a5fa', detail: '小我对威胁极度敏感——任何质疑都被视为生存威胁。常见的防卫：合理化、投射（指责别人身上你自己也有的特质）、否认、理智化。最深的防卫往往伪装成"理性分析"。' },
        { id: 'v4', label: '故事编织\nNarrative', r: 30, color: '#60a5fa', detail: '小我是故事大师：你的过去被编织成受害者的史诗或英雄的传奇。问题不在故事内容，而在于你"相信"这个故事=你。觉醒始于质疑："这个关于我自己的故事，是真的吗？"还是只是一种解读。' },
        { id: 'v5', label: '情绪劫持\nHijack', r: 30, color: '#60a5fa', detail: '当强烈情绪来袭时（愤怒、恐惧、悲伤），小我劫持注意力，让你"成为"那股情绪。关键干预点：在刺激和反应之间，有一个空间。在这个空间里，是你的自由和力量。' }
      ]
    },
    {
      id: 'branch4', label: '破解与\n转化之道', cx: 0, cy: 0, r: 44, color: '#10b981',
      angle: 90, distance: 215, category: 'solutions',
      detail: '知道了问题不等于解决了问题。张德芬提供了从认知到转化的完整路径——不是一次性顿悟，而是一系列可重复练习的内在技术。',
      children: [
        { id: 'q1', label: '觉察\nAwareness', r: 28, color: '#34d399', detail: '第一步也是最重要的一步：成为自己思想和情绪的"观察者"。当你能说"看，焦虑正在出现"而非"我很焦虑"时，你与小我之间就拉开了关键距离。觉察本身就有疗愈力。' },
        { id: 'q2', label: '接纳\nAcceptance', r: 28, color: '#34d399', detail: '"凡是你抗拒的，都会持续。"——卡尔·荣格。接纳不是赞同或喜欢，而是承认"此刻，这个感受/想法/处境就是这样"。接纳消解了对抗产生的能量消耗，打开了转化的空间。' },
        { id: 'q3', label: '臣服\nSurrender', r: 28, color: '#34d399', detail: '三部曲：①接受事实（已经发生的事无法改变）②感受情绪（不压抑不宣泄，纯然体验）③问自己：在此情境下，什么是当下最优行动？臣服结束内耗，启动创造力。' },
        { id: 'q4', label: '定静\nStillness', r: 28, color: '#34d399', detail: '在思维的间隙中，安住于宁静。定静不是思想的空白，而是超越了思想的一种存在品质。你不需要创造定静——你只需要停止在思想洪流中挣扎，定静会自然浮现。' },
        { id: 'q5', label: '连结身体\nEmbodiment', r: 28, color: '#34d399', detail: '头脑活在过去和未来，身体永远活在当下。身体觉知（呼吸、触感、肌肉张力）是最直接的"回到当下"的方式。这也是为什么瑜伽、太极、正念行走是强有力的修行工具。' },
        { id: 'q6', label: '感恩的\n力量', r: 28, color: '#34d399', detail: '感恩不只是"好态度"，而是一种意识转换技术。当你专注于感恩，你的注意力从"我缺什么"转向"我有什么"，振动频率自然上升。感恩不需要理由——它本身就是转化状态的原因。' }
      ]
    },
    {
      id: 'branch5', label: '日常\n实践工具', cx: 0, cy: 0, r: 44, color: '#ec4899',
      angle: 150, distance: 220, category: 'tools',
      detail: '理论必须落地。以下工具经过万人的实践验证，能够真正改变你与自己相处的方式——不需要灵性天赋，只需要持续练习。',
      children: [
        { id: 'b1', label: '日常冥想\nMeditation', r: 30, color: '#f472b6', detail: '每天10-15分钟静坐，关注呼吸。不用"清空念头"——只是观察它们来去，不卷入不评判。冥想不是逃避世界，而是训练自己在世界来临时保持内在稳定。' },
        { id: 'b2', label: '情绪日记\nJournaling', r: 30, color: '#f472b6', detail: '当强烈情绪出现：①命名它（愤怒/悲伤/恐惧）②定位它（身体的哪个部位？）③追溯它（过去什么类似情境被激活？）④放下它（对自己说：我看见了，我允许它离开）。书写让隐形模式显形。' },
        { id: 'b3', label: '身体扫描\nBody Scan', r: 30, color: '#f472b6', detail: '从头顶到脚趾，逐一关注每个身体部位的感受——温暖、紧绷、麻木、刺痛。不试图改变，只是观察。这个练习同时训练觉察力、接纳力和注意力。' },
        { id: 'b4', label: '信念检视\nBelief Check', r: 30, color: '#f472b6', detail: '当出现"我必须……""我应该……""如果不……就完了"等绝对化陈述时，问自己四个问题（源自拜伦·凯蒂的"一念之转"）：①这是真的吗？②你能100%确定这是真的吗？③当你相信这个想法时，你如何反应？④没有这个想法，你会是谁？' },
        { id: 'b5', label: '情绪释放\nVenting Well', r: 30, color: '#f472b6', detail: '不压抑也不放纵，给情绪一条健康通道：动态冥想/自由舞蹈/捶打枕头/在私密空间大声表达——让情绪能量在身体中完成流动，而非困在脑海中循环播放。' },
        { id: 'b6', label: '感恩清单\nGratitude', r: 30, color: '#f472b6', detail: '每晚写下3-5件当天值得感恩的事。不是大事——一杯温度刚好的水、一段通畅的地铁、一个无意的微笑。大脑的可塑性意味着：持续的感恩练习会物理性地重建你的神经回路，让"看到美好"成为默认设置。' }
      ]
    },
    {
      id: 'branch6', label: '觉醒与\n整合', cx: 0, cy: 0, r: 44, color: '#f97316',
      angle: 210, distance: 215, category: 'awakening',
      detail: '这本书的最终指向不是"逃离生活"，而是在生活中醒来——在买菜、开会、陪孩子写作业时，保持内在的觉知和自由。',
      children: [
        { id: 'p1', label: '从知道\n到做到', r: 30, color: '#fb923c', detail: '所有心灵成长的瓶颈：信息过载vs转化不足。知道"我不是我的思想"只需要一秒钟；做到"在情绪风暴中保持觉察"需要一生。关键是：允许自己失败，不把失败变成另一个自我攻击的理由。' },
        { id: 'p2', label: '日常的\n修行场', r: 30, color: '#fb923c', detail: '工作压力是最好的修行工具——它立刻暴露你的小我执着点。亲密关系是顶级道场——没有人比你伴侣更了解你的按钮。养育孩子是照妖镜——每个让你抓狂的时刻，都是未愈合的内在创伤在呐喊。' },
        { id: 'p3', label: '关系中的\n投射觉察', r: 30, color: '#fb923c', detail: '每当对他人产生强烈情绪反应时，停下来问："他在我身上看到了什么？我在他身上看到了什么？"通常你指责别人的，恰恰是你无法接纳自己的部分。投射觉察让关系从"战场"转化为"课堂"。' },
        { id: 'p4', label: '从个人\n到整体', r: 30, color: '#fb923c', detail: '觉醒的进阶：从"我需要自由"到"我们都是连接着的"。当你看清自己并非孤岛，他人的痛苦、世界的动荡，便不再"与我无关"。同情之心的自然展开，不是道德选择，而是意识扩展后的必然结果。' },
        { id: 'p5', label: '无限耐心\n即刻结果', r: 30, color: '#fb923c', detail: '一个悖论式真理：觉醒的过程需要无限的耐心（不急于求成，不评判进度），但真正的转变往往发生在一瞬间——就在你停止"试图改变"而全然"允许此刻"的那一刻。你无法逼自己醒来，但你可以不停松开抓住噩梦的拳头。' }
      ]
    }
  ];

  // Layout: calculate positions for each branch and its children
  branches.forEach((b, bi) => {
    const rad = (b.angle * Math.PI) / 180;
    b.cx = centerX + b.distance * Math.cos(rad);
    b.cy = centerY + b.distance * Math.sin(rad);
    if (b.children) {
      const n = b.children.length;
      const spreadAngle = Math.min(Math.PI * 0.65, (n - 1) * 0.42);
      const baseAng = rad + Math.PI;
      b.children.forEach((ch, ci) => {
        const ca = baseAng - spreadAngle / 2 + (spreadAngle / (n - 1 || 1)) * ci;
        ch.cx = b.cx + 95 * Math.cos(ca);
        ch.cy = b.cy + 95 * Math.sin(ca);
      });
    }
  });

  // Draw connections
  branches.forEach(b => {
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', centerX); line.setAttribute('y1', centerY);
    line.setAttribute('x2', b.cx); line.setAttribute('y2', b.cy);
    line.setAttribute('stroke', b.color);
    line.setAttribute('stroke-width', '2.5');
    line.setAttribute('opacity', '0.5');
    line.classList.add('conn-line');
    gRoot.appendChild(line);

    if (b.children) {
      b.children.forEach(ch => {
        const subLine = document.createElementNS(svgNS, 'line');
        subLine.setAttribute('x1', b.cx); subLine.setAttribute('y1', b.cy);
        subLine.setAttribute('x2', ch.cx); subLine.setAttribute('y2', ch.cy);
        subLine.setAttribute('stroke', b.color);
        subLine.setAttribute('stroke-width', '1.5');
        subLine.setAttribute('opacity', '0.3');
        subLine.classList.add('conn-line');
        gRoot.appendChild(subLine);
      });
    }
  });

  const allNodes = [];

  // Draw center node
  function drawNode(node) {
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('transform', `translate(${node.cx},${node.cy})`);
    g.classList.add('node-group');
    g.setAttribute('data-id', node.id);
    g.setAttribute('data-detail', node.detail || '');
    g.setAttribute('data-label', node.label.replace(/\n/g, ' '));

    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('r', node.r);
    circle.setAttribute('fill', node.color);
    circle.setAttribute('opacity', node.id === 'center' ? '1' : '0.85');
    circle.setAttribute('filter', 'url(#shadow)');
    circle.classList.add('node-circle');
    g.appendChild(circle);

    const lines = node.label.split('\n');
    const text = document.createElementNS(svgNS, 'text');
    text.classList.add('node-text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#fff');
    text.setAttribute('font-size', node.r > 40 ? '13px' : '11px');
    text.setAttribute('font-weight', '600');
    const lineHeight = node.r > 40 ? 17 : 15;
    const startY = -(lines.length - 1) * lineHeight / 2;
    lines.forEach((l, i) => {
      const tspan = document.createElementNS(svgNS, 'tspan');
      tspan.setAttribute('x', '0');
      tspan.setAttribute('y', startY + i * lineHeight);
      tspan.textContent = l;
      text.appendChild(tspan);
    });
    g.appendChild(text);

    gRoot.appendChild(g);
    allNodes.push({ id: node.id, g, label: node.label.replace(/\n/g, ' '), detail: node.detail || '', color: node.color });
  }

  drawNode(centerNode);
  branches.forEach(b => { drawNode(b); if (b.children) b.children.forEach(ch => drawNode(ch)); });

  // Event handlers
  let isPanning = false;
  let startX, startY;
  let translateX = 0, translateY = 0;
  let scale = 1;

  function updateTransform() {
    gRoot.setAttribute('transform', `translate(${translateX},${translateY}) scale(${scale})`);
  }

  svg.addEventListener('mousedown', (e) => {
    if (e.target === svg) {
      isPanning = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      container.classList.add('panning');
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isPanning) {
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    }
    const hovered = allNodes.find(n => {
      const rect = n.g.getBoundingClientRect();
      return e.clientX >= rect.left && e.clientX <= rect.right &&
             e.clientY >= rect.top && e.clientY <= rect.bottom;
    });
    if (hovered) {
      tooltip.textContent = hovered.label;
      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY - 40) + 'px';
      tooltip.classList.add('visible');
    } else {
      tooltip.classList.remove('visible');
    }
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    container.classList.remove('panning');
  });

  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.min(Math.max(scale * delta, 0.3), 3);
    updateTransform();
  });

  // Touch support
  svg.addEventListener('touchstart', (e) => {
    if (e.target === svg && e.touches.length === 1) {
      isPanning = true;
      startX = e.touches[0].clientX - translateX;
      startY = e.touches[0].clientY - translateY;
    }
  });
  svg.addEventListener('touchmove', (e) => {
    if (isPanning && e.touches.length === 1) {
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      updateTransform();
    }
  });
  svg.addEventListener('touchend', () => { isPanning = false; });

  // Double-click node to show detail
  svg.addEventListener('dblclick', (e) => {
    const target = e.target.closest('.node-group');
    if (!target) return;
    const node = allNodes.find(n => n.g === target);
    if (node && node.detail) {
      document.getElementById('detail-title').textContent = node.label;
      document.getElementById('detail-content').textContent = node.detail;
      detailCard.classList.add('show');
    }
  });

  document.getElementById('close-detail').addEventListener('click', () => {
    detailCard.classList.remove('show');
  });

  // Zoom controls
  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    scale = Math.min(scale * 1.2, 3);
    updateTransform();
  });
  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    scale = Math.max(scale * 0.8, 0.3);
    updateTransform();
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    scale = 1; translateX = 0; translateY = 0;
    updateTransform();
  });

})();
</script>
</body>
</html>
